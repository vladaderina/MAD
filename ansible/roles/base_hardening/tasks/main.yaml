---
- name: Отладка переменных для устранения неполадок
  debug:
    msg: |
      system_optimization.enabled: {{ system_optimization.enabled | default('не определена') }}
      memory_total_mb: {{ ansible_memtotal_mb | default('неизвестно') }}
  when: false  # Установите true для отладки

- name: Обновление кэша пакетов
  become: yes
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Обновление всех пакетов
  become: yes
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes

- name: Установка автоматических обновлений
  become: yes
  apt:
    name: unattended-upgrades
    state: present

- name: Настройка автоматических обновлений
  become: yes
  copy:
    src: files/20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Проверка расчета настроек sysctl
  set_fact:
    final_sysctl_settings: "{{ postgresql_sysctl_settings | default({}) }}"

- name: Настройка параметров sysctl
  become: yes
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ final_sysctl_settings | dict2items }}"
  when: 
    - system_optimization.enabled | default(true)
    - final_sysctl_settings | length > 0

- name: Отключение ненужных сервисов
  become: yes
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - avahi-daemon
    - cups
    - isc-dhcp-server
    - isc-dhcp-server6
    - slapd
    - nfs-kernel-server
    - bind9
    - vsftpd
  ignore_errors: yes

- name: Удаление ненужных пакетов
  become: yes
  apt:
    name: "{{ item }}"
    state: absent
    purge: yes
  loop:
    - telnet
    - ftp
    - rsh-client
    - rsh-server
    - talk
  ignore_errors: yes