# Версия PostgreSQL
postgresql_version: 16

# Сетевые настройки
postgresql_listen_addresses: "localhost"
postgresql_port: 5432

# Настройки памяти (рассчитываются автоматически)
postgresql_shared_buffers: "auto"  # 25% от оперативной памяти
postgresql_work_mem: "auto"        # Рассчитывается динамически
postgresql_effective_cache_size: "auto"  # 75% от оперативной памяти

# Настройки WAL и контрольных точек
postgresql_wal_level: "replica"
postgresql_max_wal_senders: 10
postgresql_checkpoint_timeout: "15min"
postgresql_checkpoint_completion_target: 0.9
postgresql_synchronous_commit: "on"

# Настройки производительности
postgresql_random_page_cost: 1.1    # Для SSD дисков
postgresql_effective_io_concurrency: 200  # Для NVMe дисков

# Репликация
postgresql_synchronous_standby_names: "''"  # Асинхронная репликация по умолчанию

# Пользователи и базы данных
postgresql_users: []
  # Пример структуры пользователя:
  # - name: app_user
  #   password: "{{ vault_app_user_password }}"
  #   databases: [app_db]
  #   privileges: ["ALL"]
  #   state: present

# Пароль суперпользователя (должен храниться в vault)
vault_postgres_password: "change_me_please"

# Оптимизация настроек операционной системы
postgresql_os_optimization: true

# Лимиты ОС
postgresql_limits_custom: []
  # Пример добавления кастомных лимитов:
  # - user: postgres
  #   type: soft
  #   domain: nofile
  #   value: 131072

# Переменные окружения
postgresql_environment_custom: []
  # Пример:
  # - name: PGOPTIONS
  #   value: "-c shared_buffers=2GB"

# Дополнительные настройки
postgresql_max_connections: 100